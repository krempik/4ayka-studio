<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logs | 4ayka Studio</title>
    <meta name="description" content="Журнал изменений проектов 4ayka Studio — все обновления, коммиты, релизы.">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --green: #00ff41; --green-dim: #00cc33; --green-dark: #003b00; --cyan: #00ffff; --red: #ff0040; --yellow: #ffff00; --bg: #0a0a0a; --bg-card: #0d0d0d; --border: #1a1a1a; --text: #c0c0c0; --text-dim: #555; --font: 'Fira Code', monospace; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; }
        body.light { --green: #00aa33; --green-dim: #008828; --green-dark: #00661f; --cyan: #0077cc; --red: #cc0033; --yellow: #cc9900; --bg: #f0efe8; --bg-card: #ffffff; --border: #d0cfc0; --text: #1a1a1a; --text-dim: #666; }
        .scanlines { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 1px, transparent 1px, transparent 3px); }
        body.light .scanlines { opacity: 0.3; }
        .container { max-width: 900px; margin: 0 auto; padding: 2rem; position: relative; z-index: 2; }

        .header { display: flex; justify-content: space-between; align-items: center; padding: 1.5rem 0; border-bottom: 1px solid var(--border); margin-bottom: 2rem; }
        .logo { font-size: 1.3rem; color: var(--green); letter-spacing: 4px; text-shadow: 0 0 10px var(--green-dark); text-decoration: none; }
        .header-right { display: flex; align-items: center; gap: 1rem; }
        .back { color: var(--text-dim); text-decoration: none; font-size: 0.8rem; transition: color 0.3s; }
        .back:hover { color: var(--green); }
        .theme-toggle { background: none; border: 1px solid var(--border); color: var(--text-dim); font-size: 1.1rem; cursor: pointer; padding: 6px 10px; border-radius: 4px; transition: all 0.3s; line-height: 1; font-family: var(--font); }
        .theme-toggle:hover { border-color: var(--green); color: var(--green); }

        h1 { color: var(--green); font-size: 1.5rem; margin-bottom: 0.5rem; text-shadow: 0 0 10px var(--green-dark); }
        .subtitle { color: var(--text-dim); font-size: 0.8rem; margin-bottom: 2rem; }

        /* FILTERS */
        .filters { display: flex; gap: 0.5rem; margin-bottom: 2rem; flex-wrap: wrap; }
        .filter-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-dim);
            font-family: var(--font);
            font-size: 0.75rem;
            padding: 6px 14px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .filter-btn:hover { border-color: var(--green-dark); color: var(--text); }
        .filter-btn.active { border-color: var(--green); color: var(--green); background: rgba(0,255,65,0.05); }

        /* LOG ENTRIES */
        .log-entry {
            border-left: 2px solid var(--border);
            padding: 1rem 0 1rem 1.5rem;
            margin-bottom: 0;
            position: relative;
            transition: border-color 0.3s;
        }
        .log-entry:hover { border-left-color: var(--green); }
        .log-entry::before {
            content: '';
            position: absolute;
            left: -5px;
            top: 1.2rem;
            width: 8px;
            height: 8px;
            background: var(--bg);
            border: 2px solid var(--green-dark);
            border-radius: 50%;
        }
        .log-entry:hover::before { border-color: var(--green); background: var(--green-dark); }

        .log-date { color: var(--text-dim); font-size: 0.7rem; margin-bottom: 0.3rem; }
        .log-project {
            display: inline-block;
            font-size: 0.65rem;
            padding: 1px 8px;
            border: 1px solid var(--border);
            color: var(--text-dim);
            margin-left: 0.5rem;
        }
        .log-project.tblocks { border-color: var(--green-dark); color: var(--green); }
        .log-project.messenger { border-color: #0055aa; color: #00aaff; }
        .log-project.site { border-color: #aa5500; color: #ffaa00; }

        .log-title { color: var(--text); font-size: 0.9rem; font-weight: 500; margin-bottom: 0.4rem; }
        .log-desc { color: var(--text-dim); font-size: 0.78rem; line-height: 1.5; }
        .log-desc code { background: var(--bg-card); border: 1px solid var(--border); padding: 1px 5px; color: var(--cyan); font-size: 0.72rem; }

        /* STATS BAR */
        .stats-bar {
            display: flex;
            gap: 2rem;
            padding: 1rem 0;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            margin-bottom: 2rem;
        }
        .stat-item { font-size: 0.75rem; }
        .stat-num { color: var(--green); font-size: 1.1rem; font-weight: 700; }
        .stat-label { color: var(--text-dim); margin-left: 0.3rem; }

        .footer { border-top: 1px solid var(--border); margin-top: 3rem; padding: 1.5rem 0; text-align: center; }
        .footer span { font-size: 0.75rem; color: var(--text-dim); }

        @media (max-width: 600px) {
            .header { flex-direction: column; gap: 1rem; text-align: center; }
            .header-right { justify-content: center; }
            .stats-bar { flex-wrap: wrap; gap: 1rem; }
        }
    </style>
</head>
<body>
    <div class="scanlines"></div>
    <div class="container">
        <header class="header">
            <a href="index.html" class="logo">4AYKA</a>
            <div class="header-right">
                <a href="index.html" class="back">&lt; cd ~/home</a>
                <button class="theme-toggle" id="theme-toggle" title="Сменить тему">&#9789;</button>
            </div>
        </header>

        <h1>~/logs</h1>
        <p class="subtitle">// журнал изменений всех проектов</p>

        <div class="stats-bar">
            <div class="stat-item"><span class="stat-num" id="total-entries">0</span><span class="stat-label">записей</span></div>
            <div class="stat-item"><span class="stat-num">3</span><span class="stat-label">проекта</span></div>
            <div class="stat-item"><span class="stat-num">2026</span><span class="stat-label">год</span></div>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">Все</button>
            <button class="filter-btn" data-filter="site">Сайт</button>
            <button class="filter-btn" data-filter="tblocks">T-Blocks</button>
            <button class="filter-btn" data-filter="messenger">Messenger</button>
        </div>

        <div id="log-list"></div>

        <footer class="footer">
            <span>4AYKA STUDIO | Logs | 2026</span>
        </footer>
    </div>

    <script>
        // Theme
        const themeToggle = document.getElementById('theme-toggle');
        let isLight = false;
        try { isLight = localStorage.getItem('4ayka_theme') === 'light'; } catch(e) {}
        if (isLight) { document.body.classList.add('light'); themeToggle.textContent = '\u2600'; }
        themeToggle.addEventListener('click', () => {
            isLight = !isLight;
            document.body.classList.toggle('light', isLight);
            themeToggle.textContent = isLight ? '\u2600' : '\u263D';
            try { localStorage.setItem('4ayka_theme', isLight ? 'light' : 'dark'); } catch(e) {}
        });

        // LOG DATA
        const logs = [
            // === 2026-08-27 (вторая волна) ===
            { date: '2026-08-27', project: 'site', title: 'GitHub Actions автодеплой', desc: 'Workflow <code>deploy.yml</code> — автоматический деплой на GitHub Pages при пуше в main.' },
            { date: '2026-08-27', project: 'site', title: 'Счётчик посещений', desc: 'Visitor counter в футере: всего + сегодня. Данные хранятся в SQLite на сервере.' },
            { date: '2026-08-27', project: 'site', title: 'Виджет «Сейчас онлайн»', desc: 'Real-time счётчик онлайн-пользователей. Heartbeat каждые 15 секунд.' },
            { date: '2026-08-27', project: 'tblocks', title: 'PWA для T-Blocks', desc: 'manifest.json + service worker. Игру можно установить как приложение на телефон.' },
            { date: '2026-08-27', project: 'tblocks', title: 'Visitor/Online API', desc: 'Эндпоинты <code>/api/visit</code>, <code>/api/visitors</code>, <code>/api/online</code> на сервере.' },
            { date: '2026-08-27', project: 'tblocks', title: 'Тесты для сервера', desc: 'pytest: тесты на лидерборд, отправку очков, статистику, позицию.' },
            { date: '2026-08-27', project: 'messenger', title: 'Админ-панель', desc: 'Веб-интерфейс: статистика, управление пользователями/чатами, логи. Доступ: <code>/admin.html</code>.' },
            { date: '2026-08-27', project: 'messenger', title: 'Admin API', desc: 'Эндпоинты: <code>/api/admin/login</code>, <code>/api/admin/stats</code>, <code>/api/admin/users</code>, <code>/api/admin/chats</code>.' },
            { date: '2026-08-27', project: 'messenger', title: 'Тесты для messenger', desc: 'pytest: тесты на регистрацию, логин, чаты, авторизацию, документацию.' },

            // === 2026-08-27 (первая волна) ===
            { date: '2026-08-27', project: 'site', title: 'Добавлена страница логов', desc: 'Журнал изменений всех проектов с фильтрацией по проектам.' },
            { date: '2026-08-27', project: 'site', title: 'Добавлен блог', desc: '6 статей: T-Blocks v2, E2E Messenger, Vanilla JS, Canvas, Криптография, FastAPI.' },
            { date: '2026-08-27', project: 'site', title: 'Splash screen загрузки', desc: 'Анимированный ASCII-арт логотип + прогресс-бар при загрузке страницы.' },
            { date: '2026-08-27', project: 'site', title: 'SEO meta-теги', desc: 'OpenGraph, Twitter Card, canonical URL для соцсетей и поисковиков.' },
            { date: '2026-08-27', project: 'site', title: 'Dark/Light тема', desc: 'Переключатель темы с сохранением в localStorage. Светлая тема для чтения.' },
            { date: '2026-08-27', project: 'site', title: 'Рабочая форма связи', desc: 'Форма отправляет сообщения через Telegram (@KR0VOSOS) без бэкенда.' },
            { date: '2026-08-27', project: 'tblocks', title: 'T-Blocks v2.0 запушен на GitHub', desc: 'Игра + сервер leaderboard объединены в один репозиторий <code>krempik/tblocks</code>.' },
            { date: '2026-08-27', project: 'tblocks', title: 'Обновлён README tblocks', desc: 'Актуальная информация: режимы, боссы, powerups, достижения, темы, API.' },
            { date: '2026-08-27', project: 'messenger', title: 'README для messenger', desc: 'Добавлена документация: запуск, архитектура шифрования, API, стек.' },

            // === 2026-08-26 ===
            { date: '2026-08-26', project: 'tblocks', title: 'T-Blocks v2.0 —的大规模 обновление', desc: '4 режима, 3 босса, 8 powerups, 4 темы, 12 достижений, лидерборд. ~1400 строк.' },
            { date: '2026-08-26', project: 'tblocks', title: 'Сервер лидерборда', desc: 'FastAPI + SQLite: <code>POST /api/score</code>, <code>GET /api/leaderboard</code>, <code>GET /api/stats</code>. Cloudflare Tunnel.' },
            { date: '2026-08-26', project: 'messenger', title: 'Рефакторинг messenger', desc: 'Переработан UI клиента, добавлены bio/avatar в БД, рефакторинг сервера. Коммит <code>c9f7414</code>.' },

            // === 2026-08-25 ===
            { date: '2026-08-25', project: 'site', title: 'Обновлена статистика сайта', desc: 'T-Blocks v2: 1400 строк, 8 powerups, 4 темы. Актуальные данные на главной.' },
            { date: '2026-08-25', project: 'site', title: 'Терминал обновлён', desc: 'Команды терминала показывают актуальную информацию о проектах.' },

            // === 2026-08-24 ===
            { date: '2026-08-24', project: 'site', title: '4ayka-studio запушен', desc: 'Портфолио-сайт с matrix rain, интерактивным терминалом, проектами и контактами.' },
            { date: '2026-08-24', project: 'site', title: 'Инструменты добавлены', desc: 'CryptoTool, 4AYKA OS, Hacker Typer, Particle Logo — все на vanilla JS.' },
        ];

        // RENDER
        function renderLogs(filter) {
            const list = document.getElementById('log-list');
            const filtered = filter === 'all' ? logs : logs.filter(l => l.project === filter);
            list.innerHTML = filtered.map(l => `
                <div class="log-entry">
                    <div class="log-date">${l.date}<span class="log-project ${l.project}">${l.project}</span></div>
                    <div class="log-title">${l.title}</div>
                    <div class="log-desc">${l.desc}</div>
                </div>
            `).join('');
            document.getElementById('total-entries').textContent = logs.length;
        }

        renderLogs('all');

        // FILTERS
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderLogs(btn.dataset.filter);
            });
        });
    </script>
</body>
</html>
