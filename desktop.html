<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4aykaOS v2.0</title>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--g:#00ff41;--gd:#003b00;--cy:#00ffff;--r:#ff0040;--y:#ffff00;--bg:#050505;--wb:#0c0c0c;--wh:#151515;--bd:#1e1e1e;--tx:#b0b0b0;--dm:#555;--f:'Fira Code',monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font-family:var(--f);height:100vh;overflow:hidden;user-select:none}
::selection{background:var(--g);color:#000}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--gd);border-radius:3px}
#boot{position:fixed;top:0;left:0;width:100%;height:100%;z-index:9999;background:#000;display:flex;flex-direction:column;justify-content:center;align-items:center;transition:opacity 1s}
#boot.hide{opacity:0;pointer-events:none}
.boot-logo{font-size:3rem;color:var(--g);text-shadow:0 0 30px var(--g),0 0 60px var(--gd);margin-bottom:2rem;letter-spacing:12px;animation:glow 2s ease-in-out infinite}
@keyframes glow{0%,100%{text-shadow:0 0 30px var(--g),0 0 60px var(--gd)}50%{text-shadow:0 0 50px var(--g),0 0 100px var(--gd)}}
.boot-text{width:600px;max-width:90vw;font-size:0.7rem;color:var(--gd);line-height:1.4;text-align:left;height:200px;overflow:hidden}
.boot-text .ok{color:var(--g)}
.boot-bar{width:300px;height:3px;background:#111;margin-top:2rem;border-radius:2px;overflow:hidden}
.boot-bar-fill{height:100%;background:var(--g);width:0%;transition:width 0.3s;box-shadow:0 0 10px var(--g)}
#login{position:fixed;top:0;left:0;width:100%;height:100%;z-index:9998;background:radial-gradient(ellipse at 30% 50%,#0a0a1a,#050505);display:none;flex-direction:column;justify-content:center;align-items:center;transition:opacity 0.8s}
#login.show{display:flex}#login.hide{opacity:0;pointer-events:none}
.login-avatar{width:90px;height:90px;border-radius:50%;border:2px solid var(--gd);display:flex;align-items:center;justify-content:center;font-size:2.5rem;margin-bottom:1rem;color:var(--g);background:rgba(0,255,65,0.03)}
.login-name{font-size:1.1rem;color:var(--tx);margin-bottom:1.5rem}
.login-input{background:rgba(255,255,255,0.05);border:1px solid var(--bd);color:var(--tx);font-family:var(--f);font-size:0.85rem;padding:0.6rem 1rem;width:250px;outline:none;text-align:center}
.login-input:focus{border-color:var(--gd)}
.login-hint{font-size:0.65rem;color:#333;margin-top:1rem}
.login-btn{margin-top:1rem;padding:0.5rem 2rem;background:transparent;border:1px solid var(--gd);color:var(--g);font-family:var(--f);font-size:0.8rem;cursor:pointer;transition:all 0.3s;display:none}
.login-btn.show{display:block}.login-btn:hover{background:var(--g);color:#000}
#desktop{display:none;width:100%;height:calc(100vh - 42px);position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 50%,#0a0e1a 0%,#050505 80%)}
#desktop.show{display:block}
.desk-grid{position:absolute;width:100%;height:100%;opacity:0.02;background-image:linear-gradient(var(--gd) 1px,transparent 1px),linear-gradient(90deg,var(--gd) 1px,transparent 1px);background-size:60px 60px;pointer-events:none}
.desk-particles{position:absolute;width:100%;height:100%;pointer-events:none;overflow:hidden}
.desk-particle{position:absolute;width:2px;height:2px;background:var(--gd);border-radius:50%;opacity:0.3;animation:float linear infinite}
@keyframes float{0%{transform:translateY(100vh);opacity:0}10%{opacity:0.3}90%{opacity:0.3}100%{transform:translateY(-10vh);opacity:0}}
.dicon{position:absolute;width:85px;text-align:center;cursor:pointer;padding:8px 4px;border-radius:4px;transition:background 0.2s}
.dicon:hover{background:rgba(0,255,65,0.06)}
.dicon-img{font-size:2.2rem;margin-bottom:4px;display:block;filter:drop-shadow(0 0 4px rgba(0,255,65,0.2));transition:transform 0.2s}
.dicon:hover .dicon-img{transform:scale(1.1)}
.dicon-label{font-size:0.6rem;color:#777}
.taskbar{height:42px;background:rgba(12,12,12,0.95);border-top:1px solid var(--bd);display:flex;align-items:center;padding:0 8px;gap:4px;position:relative;z-index:500;backdrop-filter:blur(15px)}
.tb-start{background:none;border:1px solid var(--bd);color:var(--g);font-family:var(--f);font-size:0.75rem;padding:5px 12px;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:6px}
.tb-start:hover{background:var(--g);color:#000;border-color:var(--g)}
.tb-sep{width:1px;height:24px;background:var(--bd);margin:0 4px}
.tb-apps{display:flex;gap:2px;flex:1;overflow-x:auto}
.tb-app{font-size:0.65rem;color:var(--dm);padding:4px 10px;cursor:pointer;border:1px solid transparent;transition:all 0.2s;white-space:nowrap;border-radius:2px}
.tb-app:hover{color:var(--tx);background:rgba(255,255,255,0.03)}
.tb-app.active{border-color:var(--gd);color:var(--g);background:rgba(0,255,65,0.04)}
.tb-tray{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:0.65rem;color:var(--dm)}
.tb-tray-item{cursor:pointer;transition:color 0.2s}.tb-tray-item:hover{color:var(--g)}
.tb-clock{color:#777;font-size:0.7rem;min-width:55px;text-align:right;cursor:pointer}.tb-clock:hover{color:var(--g)}
#startmenu{position:fixed;bottom:42px;left:0;width:320px;background:rgba(12,12,12,0.97);border:1px solid var(--bd);border-bottom:none;z-index:600;display:none;backdrop-filter:blur(20px);box-shadow:0 -5px 40px rgba(0,0,0,0.5)}
#startmenu.show{display:block}
.sm-header{padding:12px 16px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px}
.sm-avatar{width:36px;height:36px;border-radius:50%;border:1px solid var(--gd);display:flex;align-items:center;justify-content:center;font-size:1rem;color:var(--g);background:rgba(0,255,65,0.03)}
.sm-user{font-size:0.8rem;color:var(--tx)}.sm-user small{display:block;font-size:0.6rem;color:var(--dm);margin-top:2px}
.sm-apps{padding:8px 0;max-height:360px;overflow-y:auto}
.sm-app{display:flex;align-items:center;gap:10px;padding:8px 16px;cursor:pointer;transition:background 0.2s;font-size:0.8rem}
.sm-app:hover{background:rgba(0,255,65,0.05)}
.sm-app-icon{width:24px;text-align:center;font-size:1rem}.sm-app-name{color:var(--tx)}.sm-app:hover .sm-app-name{color:var(--g)}
.sm-footer{border-top:1px solid var(--bd);padding:8px 16px;display:flex;justify-content:space-between}
.sm-footer-btn{background:none;border:1px solid var(--bd);color:var(--dm);font-family:var(--f);font-size:0.65rem;padding:4px 10px;cursor:pointer;transition:all 0.2s}
.sm-footer-btn:hover{color:var(--g);border-color:var(--gd)}
#ctxmenu{position:fixed;background:rgba(14,14,14,0.97);border:1px solid var(--bd);z-index:700;display:none;min-width:180px;backdrop-filter:blur(15px);box-shadow:0 5px 30px rgba(0,0,0,0.5)}
#ctxmenu.show{display:block}
.ctx-item{padding:7px 14px;font-size:0.75rem;color:var(--tx);cursor:pointer;transition:all 0.15s;display:flex;align-items:center;gap:8px}
.ctx-item:hover{background:rgba(0,255,65,0.08);color:var(--g)}
.ctx-sep{height:1px;background:var(--bd);margin:3px 0}
.win{position:absolute;background:var(--wb);border:1px solid var(--bd);border-radius:8px;box-shadow:0 8px 40px rgba(0,0,0,0.6);display:none;flex-direction:column;overflow:hidden;min-width:320px;min-height:220px;transition:box-shadow 0.2s}
.win.open{display:flex}.win.focused{box-shadow:0 12px 50px rgba(0,0,0,0.7),0 0 1px var(--gd)}
.win.max{top:0!important;left:0!important;width:100%!important;height:100%!important;border-radius:0;z-index:400!important}
.win-head{display:flex;align-items:center;padding:6px 10px;background:var(--wh);border-bottom:1px solid var(--bd);flex-shrink:0;gap:8px;cursor:move}
.win-dots{display:flex;gap:6px}
.win-dot{width:12px;height:12px;border-radius:50%;cursor:pointer;transition:opacity 0.2s}
.win-dot.r{background:#ff5f57}.win-dot.r:hover{background:#ff3b30}
.win-dot.y{background:#ffbd2e}.win-dot.y:hover{background:#ffb800}
.win-dot.g{background:#28c840}.win-dot.g:hover{background:#20b238}
.win-title{font-size:0.7rem;color:#888;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.win-title-icon{font-size:0.8rem;margin-right:2px}
.win-body{flex:1;overflow:auto;position:relative}
.win-resize{position:absolute;bottom:0;right:0;width:14px;height:14px;cursor:nwse-resize;z-index:5}
.app-term{display:flex;flex-direction:column;height:100%;background:#0a0a0a}
.term-bar{padding:4px 10px;background:#111;border-bottom:1px solid var(--bd);font-size:0.65rem;color:var(--dm);display:flex;gap:12px}
.term-bar span.active{color:var(--g)}
.term-output{flex:1;padding:10px;font-size:0.78rem;line-height:1.5;overflow-y:auto}
.term-output .t{white-space:pre-wrap;word-break:break-all}
.term-output .tg{color:var(--g)}.term-output .tr{color:var(--r)}.term-output .tc{color:var(--cy)}.term-output .ty{color:var(--y)}.term-output .td{color:var(--dm)}
.term-input-area{display:flex;padding:4px 10px 8px;border-top:1px solid var(--bd);align-items:center}
.term-input-area .p{color:var(--g);margin-right:6px;font-size:0.78rem;white-space:nowrap}
.term-in{flex:1;background:none;border:none;color:var(--tx);font-family:var(--f);font-size:0.78rem;outline:none}
.app-fm{display:flex;flex-direction:column;height:100%}
.fm-toolbar{padding:6px 10px;background:#111;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px;font-size:0.7rem}
.fm-toolbar button{background:none;border:1px solid var(--bd);color:var(--dm);padding:2px 8px;font-family:var(--f);font-size:0.65rem;cursor:pointer}
.fm-toolbar button:hover{color:var(--g);border-color:var(--gd)}
.fm-path{color:var(--dm);flex:1;padding:0 8px;font-size:0.7rem}
.fm-list{flex:1;padding:4px 0;overflow-y:auto}
.fm-item{display:flex;align-items:center;gap:10px;padding:5px 12px;cursor:pointer;transition:background 0.15s;font-size:0.75rem}
.fm-item:hover{background:rgba(0,255,65,0.04)}.fm-item.selected{background:rgba(0,255,65,0.08)}
.fm-icon{width:20px;text-align:center;font-size:0.9rem}
.fm-name{color:#999}.fm-item.dir .fm-name{color:var(--cy)}
.fm-size{margin-left:auto;color:#444;font-size:0.65rem}
.fm-status{padding:4px 12px;background:#111;border-top:1px solid var(--bd);font-size:0.65rem;color:var(--dm)}
.app-sys{padding:14px;font-size:0.75rem;height:100%;overflow-y:auto}
.sys-title{color:var(--g);font-size:0.85rem;margin-bottom:12px;text-shadow:0 0 8px var(--gd)}
.sys-row{display:flex;justify-content:space-between;margin-bottom:2px;color:var(--dm)}.sys-row .val{color:var(--g)}
.sys-bar{background:#1a1a1a;height:6px;border-radius:3px;margin:4px 0 12px;overflow:hidden}
.sys-fill{height:100%;border-radius:3px;transition:width 1.5s ease}
.sys-fill.green{background:linear-gradient(90deg,var(--gd),var(--g))}
.sys-fill.cyan{background:linear-gradient(90deg,#003333,var(--cy))}
.sys-fill.red{background:linear-gradient(90deg,#330000,var(--r))}
.sys-fill.yellow{background:linear-gradient(90deg,#333300,var(--y))}
.sys-section{margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--bd)}.sys-section:last-child{border-bottom:none}
.app-net{padding:14px;font-size:0.75rem;height:100%;overflow-y:auto}
.net-chart{width:100%;height:120px;background:#0a0a0a;border:1px solid var(--bd);border-radius:4px;margin:8px 0 14px;overflow:hidden}
.net-canvas{width:100%;height:100%}
.net-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.net-stat{padding:8px;background:#0a0a0a;border:1px solid var(--bd);border-radius:4px}
.net-stat-label{font-size:0.65rem;color:var(--dm);margin-bottom:4px}
.net-stat-val{font-size:1rem;color:var(--g)}
.app-editor{display:flex;flex-direction:column;height:100%}
.ed-menu{padding:4px 10px;background:#111;border-bottom:1px solid var(--bd);font-size:0.65rem;color:var(--dm);display:flex;gap:12px}
.ed-menu span{cursor:pointer}.ed-menu span:hover{color:var(--g)}
.ed-content{flex:1;padding:10px;font-size:0.78rem;color:#aaa;background:var(--wb);border:none;outline:none;resize:none;font-family:var(--f);line-height:1.6}
.app-calc{padding:12px;display:flex;flex-direction:column;height:100%}
.calc-display{background:#0a0a0a;border:1px solid var(--bd);border-radius:4px;padding:12px;text-align:right;margin-bottom:10px;min-height:50px;display:flex;flex-direction:column;justify-content:flex-end}
.calc-expr{font-size:0.7rem;color:var(--dm);min-height:16px}
.calc-result{font-size:1.5rem;color:var(--g)}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;flex:1}
.calc-btn{background:#111;border:1px solid var(--bd);color:var(--tx);font-family:var(--f);font-size:0.85rem;cursor:pointer;transition:all 0.15s;border-radius:3px;display:flex;align-items:center;justify-content:center}
.calc-btn:hover{background:rgba(0,255,65,0.08);color:var(--g);border-color:var(--gd)}
.calc-btn.op{color:var(--cy)}.calc-btn.eq{background:var(--gd);color:#000;border-color:var(--g)}.calc-btn.eq:hover{background:var(--g)}
.calc-btn.clear{color:var(--r)}
.app-passgen{padding:14px;height:100%;overflow-y:auto}
.passgen-output{background:#0a0a0a;border:1px solid var(--bd);padding:12px;font-size:1.1rem;color:var(--g);text-align:center;word-break:break-all;margin-bottom:12px;border-radius:4px;letter-spacing:1px;min-height:45px;display:flex;align-items:center;justify-content:center}
.passgen-controls{display:flex;flex-direction:column;gap:10px}
.passgen-row{display:flex;align-items:center;justify-content:space-between;font-size:0.75rem}
.passgen-row label{color:var(--dm)}
.passgen-row input[type=range]{width:120px;accent-color:var(--g)}
.passgen-row input[type=checkbox]{accent-color:var(--g)}
.passgen-btns{display:flex;gap:6px;margin-top:8px}
.passgen-btn{flex:1;padding:8px;background:transparent;border:1px solid var(--gd);color:var(--g);font-family:var(--f);font-size:0.8rem;cursor:pointer;transition:all 0.2s;border-radius:3px}
.passgen-btn:hover{background:var(--g);color:#000}
.app-about{padding:20px;text-align:center;height:100%;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.about-logo{font-size:2.5rem;color:var(--g);text-shadow:0 0 20px var(--g);letter-spacing:6px}
.about-ver{color:var(--dm);font-size:0.75rem}
.about-info{font-size:0.75rem;color:var(--dm);line-height:1.8;text-align:left;max-width:300px}.about-info span{color:var(--g)}
#shutdown{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:10000;display:none;flex-direction:column;justify-content:center;align-items:center}
#shutdown.show{display:flex}
.shut-text{color:var(--dm);font-size:0.8rem;animation:fadeOut 2s forwards}
@keyframes fadeOut{0%{opacity:1}70%{opacity:1}100%{opacity:0}}
.notif{position:fixed;top:12px;right:12px;background:rgba(14,14,14,0.95);border:1px solid var(--bd);border-left:3px solid var(--g);padding:10px 16px;border-radius:4px;z-index:800;font-size:0.75rem;color:var(--tx);box-shadow:0 5px 20px rgba(0,0,0,0.4);transform:translateX(120%);transition:transform 0.3s;max-width:300px}
.notif.show{transform:translateX(0)}
.notif-title{color:var(--g);font-size:0.7rem;margin-bottom:3px}
</style>
</head>
<body><body>

</html><script>
const C={g:'#00ff41',gd:'#003b00',cy:'#00ffff',r:'#ff0040',y:'#ffff00'};
let wins={},winZ=100,activeWin=null,cmdHistory=[],cmdHistIdx=-1;

const startTime=Date.now();// File Manager
function initFM(w){const list=w.querySelector('[id^=flist-]');const pathEl=w.querySelector('[id^=fpath-]');const stat=w.querySelector('[id^=fstat-]');
let curDir='~';function render(){pathEl.textContent=curDir;
const item=termFS[curDir]||VFS[curDir];
if(!item||!item.children){list.innerHTML='<div style="padding:12px;color:#555">Пустая директория</div>';return}
list.innerHTML='';let files=0,folders=0;
item.children.forEach(n=>{const fp=curDir+'/'+n;const child=termFS[fp]||VFS[fp];
const isDir=child&&(child.type==='dir')||(!child&&VFS[fp]?.type==='dir');
if(isDir)folders++;else files++;
const d=document.createElement('div');d.className='fm-item'+(isDir?' dir':'');
d.innerHTML=`<span class="fm-icon">${isDir?'📁':'📄'}</span><span class="fm-name">${n}</span><span class="fm-size">${isDir?(child?.children?.length||0)+' items':child?.size||''}</span>`;
d.onclick=ev=>{w.querySelectorAll('.fm-item').forEach(x=>x.classList.remove('selected'));d.classList.add('selected')};
d.ondblclick=()=>{if(isDir){curDir=fp;render()}else if(child?.content){printTerm(w.querySelector('.term-output')||list,child.content);showNotif('Файлы','Открыт: '+n)}}
list.appendChild(d)});
stat.textContent=`📁 ${folders} папок, 📄 ${files} файлов`}
render();w._fmRender=render;w._fmDir=()=>curDir;w._fmSetDir=d=>{curDir=d;render()}}
function fmUp(btn){const w=btn.closest('.win');if(!w)return;const p=w._fmDir().split('/');if(p.length>1){p.pop();w._fmSetDir(p.join('/')||'~')}}
function fmRoot(btn){const w=btn.closest('.win');if(w&&w._fmSetDir)w._fmSetDir('~')}
function fmRefresh(btn){const w=btn.closest('.win');if(w&&w._fmRender)w._fmRender()}
// Calculator
function initCalc(w){const grid=w.querySelector('[id^=cgrid-]');const exprEl=w.querySelector('[id^=cexpr-]');const resEl=w.querySelector('[id^=cres-]');
let expr='';let lastWasOp=false;
const btns=['C','⌫','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','±','0','.','=',''];
grid.style.gridTemplateColumns='repeat(4,1fr)';
btns.forEach(b=>{const d=document.createElement('button');d.className='calc-btn';d.textContent=b;
if('÷×−+%=±'.includes(b))d.classList.add('op');if(b==='=')d.classList.add('eq');if(b==='C'||b==='⌫')d.classList.add('clear');
d.onclick=()=>{if(b==='C'){expr='';lastWasOp=false}else if(b==='⌫'){expr=expr.slice(0,-1);lastWasOp=false}
else if(b==='='){try{let ev=expr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
let r=eval(ev);resEl.textContent=isNaN(r)||!isFinite(r)?'Error':parseFloat(r.toFixed(10));expr=''+resEl.textContent;lastWasOp=true}catch{resEl.textContent='Error'}}
else if(b==='±'){expr=expr.startsWith('-')?expr.slice(1):'-'+expr}
else if(b==='%'){expr+='%';lastWasOp=false}
else{if('÷×−+'.includes(b)&&lastWasOp){expr=expr.slice(0,-1)}lastWasOp='÷×−+'.includes(b);expr+=b}
exprEl.textContent=expr};grid.appendChild(d)})}
// Password Generator
function initPassGen(w){genPass(w.querySelector('.passgen-btn'))}
function genPass(btn){const w=btn.closest('.win');const out=w.querySelector('[id^=pgout-]');
const len=parseInt(w.querySelector('[id^=pglen-]').value);
const u=w.querySelector('[id^=pgu-]').checked,l=w.querySelector('[id^=pgl-]').checked;
const d=w.querySelector('[id^=pgd-]').checked,s=w.querySelector('[id^=pgs-]').checked;
let ch='';if(u)ch+='ABCDEFGHIJKLMNOPQRSTUVWXYZ';if(l)ch+='abcdefghijklmnopqrstuvwxyz';
if(d)ch+='0123456789';if(s)ch+='!@#$%^&*()_+-=[]{}|;:,.<>?';
if(!ch){out.textContent='Выберите хотя бы один тип';out.style.color=C.r;return}
const arr=new Uint32Array(len);crypto.getRandomValues(arr);
out.textContent=[...arr].map(x=>ch[x%ch.length]).join('');out.style.color=C.g;
const p=out.textContent;const sc=p.length>=20?3:p.length>=14?2:1;
showNotif('🔐 PassGen',`Пароль создан • Длина: ${len} • Уровень: ${['','🟢 Слабый','🟡 Средний','🟢 Сильный'][sc]}`)}
function copyPass(btn){const w=btn.closest('.win');const out=w.querySelector('[id^=pgout-]');
if(out.textContent&&out.textContent.length>5){navigator.clipboard.writeText(out.textContent).then(()=>showNotif('📋 Скопировано','Пароль скопирован в буфер обмена')).catch(()=>showNotif('❌ Ошибка','Не удалось скопировать'))}}// Network Monitor
function initNet(w){const canvas=w.querySelector('[id^=ncanvas-]');if(!canvas)return;
const ctx=canvas.getContext('2d');const downEl=w.querySelector('[id^=ndown-]');const upEl=w.querySelector('[id^=nup-]');
const rxEl=w.querySelector('[id^=nrx-]');const txEl=w.querySelector('[id^=ntx-]');
let downData=[],upData=[],rxTotal=0,txTotal=0;
function resize(){canvas.width=canvas.parentElement.offsetWidth;canvas.height=canvas.parentElement.offsetHeight}
resize();window.addEventListener('resize',resize);
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);
const max=Math.max(...downData,...upData,100);
const step=canvas.width/60;
ctx.strokeStyle='rgba(0,60,0,0.3)';ctx.lineWidth=0.5;
for(let y=0;y<canvas.height;y+=20){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke()}
if(downData.length>1){ctx.beginPath();ctx.strokeStyle='#00ff41';ctx.lineWidth=1.5;
ctx.shadowColor='#00ff41';ctx.shadowBlur=4;
downData.forEach((v,i)=>{const x=i*step;const y=canvas.height-v/max*canvas.height*0.9;
i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)});ctx.stroke();ctx.shadowBlur=0}
if(upData.length>1){ctx.beginPath();ctx.strokeStyle='#00ffff';ctx.lineWidth=1.5;
ctx.shadowColor='#00ffff';ctx.shadowBlur=4;
upData.forEach((v,i)=>{const x=i*step;const y=canvas.height-v/max*canvas.height*0.9;
i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)});ctx.stroke();ctx.shadowBlur=0}}
function update(){const d=50+Math.random()*300;const u=20+Math.random()*150;
downData.push(d);upData.push(u);if(downData.length>60)downData.shift();if(upData.length>60)upData.shift();
rxTotal+=Math.floor(d*10);txTotal+=Math.floor(u*10);
downEl.textContent=d.toFixed(0)+' KB/s';upEl.textContent=u.toFixed(0)+' KB/s';
rxEl.textContent=rxTotal.toLocaleString();txEl.textContent=txTotal.toLocaleString();draw()}
w._netIv=setInterval(update,1000);update()}

render();w._sysIv=setInterval(render,2000)}
