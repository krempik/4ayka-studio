<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4aykaOS v2.1</title>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--g:#00ff41;--gd:#003b00;--cy:#00ffff;--r:#ff0040;--y:#ffff00;--bg:#050505;--wb:#0c0c0c;--wh:#151515;--bd:#1e1e1e;--tx:#b0b0b0;--dm:#555;--f:'Fira Code',monospace}
body.light{--g:#008b30;--gd:#00611f;--cy:#0077a8;--r:#b30033;--y:#a89200;--bg:#e8e7e0;--wb:#f7f6f0;--wh:#ffffff;--bd:#c9c7ba;--tx:#2a2a2a;--dm:#757575}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font-family:var(--f);height:100vh;overflow:hidden;user-select:none}
::selection{background:var(--g);color:#000}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--gd);border-radius:3px}
#boot{position:fixed;top:0;left:0;width:100%;height:100%;z-index:9999;background:#000;display:flex;flex-direction:column;justify-content:center;align-items:center;transition:opacity 1s}
#boot.hide{opacity:0;pointer-events:none}
.boot-logo{font-size:3rem;color:var(--g);text-shadow:0 0 30px var(--g),0 0 60px var(--gd);margin-bottom:2rem;letter-spacing:12px;animation:glow 2s ease-in-out infinite}
@keyframes glow{0%,100%{text-shadow:0 0 30px var(--g),0 0 60px var(--gd)}50%{text-shadow:0 0 50px var(--g),0 0 100px var(--gd)}}
.boot-text{width:600px;max-width:90vw;font-size:0.7rem;color:#0f7a35;line-height:1.4;text-align:left;height:200px;overflow:hidden}
.boot-text .ok{color:var(--g);text-shadow:0 0 6px var(--gd)}
.boot-bar{width:300px;height:3px;background:#111;margin-top:2rem;border-radius:2px;overflow:hidden}
.boot-bar-fill{height:100%;background:var(--g);width:0%;transition:width 0.3s;box-shadow:0 0 10px var(--g)}
#login{position:fixed;top:0;left:0;width:100%;height:100%;z-index:9998;background:radial-gradient(ellipse at 30% 50%,#0a0a1a,#050505);display:none;flex-direction:column;justify-content:center;align-items:center;transition:opacity 0.8s}
#login.show{display:flex}#login.hide{opacity:0;pointer-events:none}
.login-avatar{width:90px;height:90px;border-radius:50%;border:2px solid var(--gd);display:flex;align-items:center;justify-content:center;font-size:2.5rem;margin-bottom:1rem;color:var(--g);background:rgba(0,255,65,0.03)}
.login-name{font-size:1.1rem;color:var(--tx);margin-bottom:1.5rem}
.login-hint{font-size:0.65rem;color:#999;margin-top:1rem}
.login-btn{margin-top:1rem;padding:0.5rem 2rem;background:transparent;border:1px solid var(--gd);color:var(--g);font-family:var(--f);font-size:0.8rem;cursor:pointer;transition:all 0.3s}
.login-btn:hover{background:var(--g);color:#000}
#desktop{display:none;width:100%;height:calc(100vh - 42px);position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 50%,#0a0e1a 0%,#050505 80%)}
#desktop.show{display:block}
.desk-grid{position:absolute;width:100%;height:100%;opacity:0.02;background-image:linear-gradient(var(--gd) 1px,transparent 1px),linear-gradient(90deg,var(--gd) 1px,transparent 1px);background-size:60px 60px;pointer-events:none}
.desk-particles{position:absolute;width:100%;height:100%;pointer-events:none;overflow:hidden}
.desk-particle{position:absolute;width:2px;height:2px;background:var(--gd);border-radius:50%;opacity:0.3;animation:float linear infinite}
@keyframes float{0%{transform:translateY(100vh);opacity:0}10%{opacity:0.3}90%{opacity:0.3}100%{transform:translateY(-10vh);opacity:0}}
.dicon{position:absolute;width:85px;text-align:center;cursor:pointer;padding:8px 4px;border-radius:4px;transition:background 0.2s}
.dicon:hover{background:rgba(0,255,65,0.06)}
.dicon-img{font-size:2.2rem;margin-bottom:4px;display:block;filter:drop-shadow(0 0 4px rgba(0,255,65,0.2));transition:transform 0.2s}
.dicon:hover .dicon-img{transform:scale(1.1)}
.dicon-label{font-size:0.6rem;color:#777}
.taskbar{height:42px;background:rgba(12,12,12,0.95);border-top:1px solid var(--bd);display:flex;align-items:center;padding:0 8px;gap:4px;position:relative;z-index:500;backdrop-filter:blur(15px)}
.tb-start{background:none;border:1px solid var(--bd);color:var(--g);font-family:var(--f);font-size:0.75rem;padding:5px 12px;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:6px}
.tb-start:hover{background:var(--g);color:#000;border-color:var(--g)}
.tb-sep{width:1px;height:24px;background:var(--bd);margin:0 4px}
.tb-apps{display:flex;gap:2px;flex:1;overflow-x:auto}
.tb-app{font-size:0.65rem;color:var(--dm);padding:4px 10px;cursor:pointer;border:1px solid transparent;transition:all 0.2s;white-space:nowrap;border-radius:2px}
.tb-app:hover{color:var(--tx);background:rgba(255,255,255,0.03)}
.tb-app.active{border-color:var(--gd);color:var(--g);background:rgba(0,255,65,0.04)}
.tb-tray{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:0.65rem;color:var(--dm)}
.tb-tray-item{cursor:pointer;transition:color 0.2s}.tb-tray-item:hover{color:var(--g)}
.tb-clock{color:#777;font-size:0.7rem;min-width:55px;text-align:right;cursor:pointer}.tb-clock:hover{color:var(--g)}
#startmenu{position:fixed;bottom:42px;left:0;width:320px;background:rgba(12,12,12,0.97);border:1px solid var(--bd);border-bottom:none;z-index:600;display:none;backdrop-filter:blur(20px);box-shadow:0 -5px 40px rgba(0,0,0,0.5)}
#startmenu.show{display:block}
.sm-header{padding:12px 16px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px}
.sm-avatar{width:36px;height:36px;border-radius:50%;border:1px solid var(--gd);display:flex;align-items:center;justify-content:center;font-size:1rem;color:var(--g);background:rgba(0,255,65,0.03)}
.sm-user{font-size:0.8rem;color:var(--tx)}.sm-user small{display:block;font-size:0.6rem;color:var(--dm);margin-top:2px}
.sm-apps{padding:8px 0;max-height:360px;overflow-y:auto}
.sm-app{display:flex;align-items:center;gap:10px;padding:8px 16px;cursor:pointer;transition:background 0.2s;font-size:0.8rem}
.sm-app:hover{background:rgba(0,255,65,0.05)}
.sm-app-icon{width:24px;text-align:center;font-size:1rem}.sm-app-name{color:var(--tx)}.sm-app:hover .sm-app-name{color:var(--g)}
.sm-footer{border-top:1px solid var(--bd);padding:8px 16px;display:flex;justify-content:space-between}
.sm-footer-btn{background:none;border:1px solid var(--bd);color:var(--dm);font-family:var(--f);font-size:0.65rem;padding:4px 10px;cursor:pointer;transition:all 0.2s}
.sm-footer-btn:hover{color:var(--g);border-color:var(--gd)}
#ctxmenu{position:fixed;background:rgba(14,14,14,0.97);border:1px solid var(--bd);z-index:700;display:none;min-width:180px;backdrop-filter:blur(15px);box-shadow:0 5px 30px rgba(0,0,0,0.5)}
#ctxmenu.show{display:block}
.ctx-item{padding:7px 14px;font-size:0.75rem;color:var(--tx);cursor:pointer;transition:all 0.15s;display:flex;align-items:center;gap:8px}
.ctx-item:hover{background:rgba(0,255,65,0.08);color:var(--g)}
.ctx-sep{height:1px;background:var(--bd);margin:3px 0}
.win{position:absolute;background:var(--wb);border:1px solid var(--bd);border-radius:8px;box-shadow:0 8px 40px rgba(0,0,0,0.6);display:none;flex-direction:column;overflow:hidden;min-width:320px;min-height:220px;transition:box-shadow 0.2s;animation:winAppear 0.18s ease}
@keyframes winAppear{from{opacity:0;transform:scale(0.96)}to{opacity:1;transform:scale(1)}}
.win.open{display:flex}.win.focused{box-shadow:0 12px 50px rgba(0,0,0,0.7),0 0 1px var(--gd)}
.win.max{top:0!important;left:0!important;width:100%!important;height:100%!important;border-radius:0;z-index:400!important}
.win-head{display:flex;align-items:center;padding:6px 10px;background:var(--wh);border-bottom:1px solid var(--bd);flex-shrink:0;gap:8px;cursor:move}
.win-dots{display:flex;gap:6px}
.win-dot{width:12px;height:12px;border-radius:50%;cursor:pointer;transition:opacity 0.2s}
.win-dot.r{background:#ff5f57}.win-dot.r:hover{background:#ff3b30}
.win-dot.y{background:#ffbd2e}.win-dot.y:hover{background:#ffb800}
.win-dot.g{background:#28c840}.win-dot.g:hover{background:#20b238}
.win-title{font-size:0.7rem;color:#888;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.win-body{flex:1;overflow:auto;position:relative}
.win-resize{position:absolute;bottom:0;right:0;width:14px;height:14px;cursor:nwse-resize;z-index:5}
.app-term{display:flex;flex-direction:column;height:100%;background:#0a0a0a}
.term-bar{padding:4px 10px;background:#111;border-bottom:1px solid var(--bd);font-size:0.65rem;color:var(--dm);display:flex;gap:12px}
.term-bar span.active{color:var(--g)}
.term-output{flex:1;padding:10px;font-size:0.78rem;line-height:1.5;overflow-y:auto}
.term-output .t{white-space:pre-wrap;word-break:break-all}
.term-input-area{display:flex;padding:4px 10px 8px;border-top:1px solid var(--bd);align-items:center}
.term-input-area .p{color:var(--g);margin-right:6px;font-size:0.78rem;white-space:nowrap}
.term-in{flex:1;background:none;border:none;color:var(--tx);font-family:var(--f);font-size:0.78rem;outline:none}
.app-fm{display:flex;flex-direction:column;height:100%}
.fm-toolbar{padding:6px 10px;background:#111;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px;font-size:0.7rem}
.fm-toolbar button{background:none;border:1px solid var(--bd);color:var(--dm);padding:2px 8px;font-family:var(--f);font-size:0.65rem;cursor:pointer}
.fm-toolbar button:hover{color:var(--g);border-color:var(--gd)}
.fm-path{color:var(--dm);flex:1;padding:0 8px;font-size:0.7rem}
.fm-list{flex:1;padding:4px 0;overflow-y:auto}
.fm-item{display:flex;align-items:center;gap:10px;padding:5px 12px;cursor:pointer;transition:background 0.15s;font-size:0.75rem}
.fm-item:hover{background:rgba(0,255,65,0.04)}.fm-item.selected{background:rgba(0,255,65,0.08)}
.fm-icon{width:20px;text-align:center;font-size:0.9rem}
.fm-name{color:#999}.fm-item.dir .fm-name{color:var(--cy)}
.fm-size{margin-left:auto;color:#444;font-size:0.65rem}
.fm-status{padding:4px 12px;background:#111;border-top:1px solid var(--bd);font-size:0.65rem;color:var(--dm)}
.app-sys{padding:14px;font-size:0.75rem;height:100%;overflow-y:auto}
.sys-title{color:var(--g);font-size:0.85rem;margin-bottom:12px;text-shadow:0 0 8px var(--gd)}
.sys-row{display:flex;justify-content:space-between;margin-bottom:2px;color:var(--dm)}.sys-row .val{color:var(--g)}
.sys-bar{background:#1a1a1a;height:6px;border-radius:3px;margin:4px 0 12px;overflow:hidden}
.sys-fill{height:100%;border-radius:3px;transition:width 1.5s ease}
.sys-fill.green{background:linear-gradient(90deg,var(--gd),var(--g))}
.sys-fill.cyan{background:linear-gradient(90deg,#003333,var(--cy))}
.sys-fill.red{background:linear-gradient(90deg,#330000,var(--r))}
.sys-fill.yellow{background:linear-gradient(90deg,#333300,var(--y))}
.sys-section{margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--bd)}.sys-section:last-child{border-bottom:none}
.app-net{padding:14px;font-size:0.75rem;height:100%;overflow-y:auto}
.net-chart{width:100%;height:120px;background:#0a0a0a;border:1px solid var(--bd);border-radius:4px;margin:8px 0 14px;overflow:hidden}
.net-canvas{width:100%;height:100%}
.net-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.net-stat{padding:8px;background:#0a0a0a;border:1px solid var(--bd);border-radius:4px}
.net-stat-label{font-size:0.65rem;color:var(--dm);margin-bottom:4px}
.net-stat-val{font-size:1rem;color:var(--g)}
.app-editor{display:flex;flex-direction:column;height:100%}
.ed-menu{padding:4px 10px;background:#111;border-bottom:1px solid var(--bd);font-size:0.65rem;color:var(--dm);display:flex;gap:12px}
.ed-menu span{cursor:pointer}.ed-menu span:hover{color:var(--g)}
.ed-content{flex:1;padding:10px;font-size:0.78rem;color:#aaa;background:var(--wb);border:none;outline:none;resize:none;font-family:var(--f);line-height:1.6}
.ed-file{display:none;padding:4px 10px;background:#0a0a0a;border-bottom:1px solid var(--bd);gap:6px;align-items:center}
.ed-file.show{display:flex}
.ed-file-in{flex:1;background:#111;border:1px solid var(--bd);color:var(--tx);font-family:var(--f);font-size:0.7rem;padding:3px 8px;outline:none}
.ed-file-in:focus{border-color:var(--gd)}
.ed-file-btn{background:none;border:1px solid var(--gd);color:var(--g);font-family:var(--f);font-size:0.65rem;padding:3px 10px;cursor:pointer;transition:all 0.15s}
.ed-file-btn:hover{background:var(--g);color:#000}
.app-calc{padding:12px;display:flex;flex-direction:column;height:100%}
.calc-display{background:#0a0a0a;border:1px solid var(--bd);border-radius:4px;padding:12px;text-align:right;margin-bottom:10px;min-height:50px;display:flex;flex-direction:column;justify-content:flex-end}
.calc-expr{font-size:0.7rem;color:var(--dm);min-height:16px}
.calc-result{font-size:1.5rem;color:var(--g)}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;flex:1}
.calc-btn{background:#111;border:1px solid var(--bd);color:var(--tx);font-family:var(--f);font-size:0.85rem;cursor:pointer;transition:all 0.15s;border-radius:3px;display:flex;align-items:center;justify-content:center}
.calc-btn:hover{background:rgba(0,255,65,0.08);color:var(--g);border-color:var(--gd)}
.calc-btn.op{color:var(--cy)}.calc-btn.eq{background:var(--gd);color:#000;border-color:var(--g)}.calc-btn.eq:hover{background:var(--g)}
.calc-btn.clear{color:var(--r)}
.app-passgen{padding:14px;height:100%;overflow-y:auto}
.passgen-output{background:#0a0a0a;border:1px solid var(--bd);padding:12px;font-size:1.1rem;color:var(--g);text-align:center;word-break:break-all;margin-bottom:12px;border-radius:4px;letter-spacing:1px;min-height:45px;display:flex;align-items:center;justify-content:center}
.passgen-controls{display:flex;flex-direction:column;gap:10px}
.passgen-row{display:flex;align-items:center;justify-content:space-between;font-size:0.75rem}
.passgen-row label{color:var(--dm)}
.passgen-row input[type=range]{width:120px;accent-color:var(--g)}
.passgen-row input[type=checkbox]{accent-color:var(--g)}
.passgen-btns{display:flex;gap:6px;margin-top:8px}
.passgen-btn{flex:1;padding:8px;background:transparent;border:1px solid var(--gd);color:var(--g);font-family:var(--f);font-size:0.8rem;cursor:pointer;transition:all 0.2s;border-radius:3px}
.passgen-btn:hover{background:var(--g);color:#000}
.app-about{padding:20px;text-align:center;height:100%;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.about-logo{font-size:2.5rem;color:var(--g);text-shadow:0 0 20px var(--g);letter-spacing:6px}
.about-ver{color:var(--dm);font-size:0.75rem}
.about-info{font-size:0.75rem;color:var(--dm);line-height:1.8;text-align:left;max-width:300px}.about-info span{color:var(--g)}
#shutdown{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:10000;display:none;flex-direction:column;justify-content:center;align-items:center}
#shutdown.show{display:flex}
.shut-text{color:var(--dm);font-size:0.8rem;animation:fadeOut 2s forwards}
@keyframes fadeOut{0%{opacity:1}70%{opacity:1}100%{opacity:0}}
.notif{position:fixed;top:12px;right:12px;background:rgba(14,14,14,0.95);border:1px solid var(--bd);border-left:3px solid var(--g);padding:10px 16px;border-radius:4px;z-index:800;font-size:0.75rem;color:var(--tx);box-shadow:0 5px 20px rgba(0,0,0,0.4);transform:translateX(120%);transition:transform 0.3s;max-width:300px}
.notif.show{transform:translateX(0)}
.notif-title{color:var(--g);font-size:0.7rem;margin-bottom:3px}
</style>
</head>
<body>
<div id="boot">
<div class="boot-logo">4AYKA</div>
<div class="boot-text" id="bootLog"></div>
<div class="boot-bar"><div class="boot-bar-fill" id="bootBar"></div></div>
</div>
<div id="login">
<div class="login-avatar">&#x1F464;</div>
<div class="login-name" id="loginName">user@4ayka</div>
<div class="login-hint">Нажмите Enter или кнопку ниже</div>
<button class="login-btn" id="loginBtn">&#x26A1; ВОЙТИ</button>
</div>
<div id="desktop">
<div class="desk-grid"></div>
<div class="desk-particles" id="deskParticles"></div>
<div class="dicon" style="top:20px;left:20px" data-app="term"><span class="dicon-img">&#x1F5A5;</span><span class="dicon-label">Terminal</span></div>
<div class="dicon" style="top:20px;left:130px" data-app="fm"><span class="dicon-img">&#x1F4C1;</span><span class="dicon-label">Файлы</span></div>
<div class="dicon" style="top:115px;left:20px" data-app="editor"><span class="dicon-img">&#x1F4DD;</span><span class="dicon-label">Editor</span></div>
<div class="dicon" style="top:115px;left:130px" data-app="calc"><span class="dicon-img">&#x1F9EE;</span><span class="dicon-label">Calculator</span></div>
<div class="dicon" style="top:210px;left:20px" data-app="net"><span class="dicon-img">&#x1F310;</span><span class="dicon-label">Network</span></div>
<div class="dicon" style="top:210px;left:130px" data-app="passgen"><span class="dicon-img">&#x1F510;</span><span class="dicon-label">PassGen</span></div>
<div class="dicon" style="top:305px;left:20px" data-app="sys"><span class="dicon-img">&#x1F4CA;</span><span class="dicon-label">System</span></div>
<div class="dicon" style="top:305px;left:130px" data-app="about"><span class="dicon-img">&#x2139;</span><span class="dicon-label">About</span></div>
</div>
<div id="startmenu">
<div class="sm-header"><div class="sm-avatar">&#x1F464;</div><div class="sm-user" id="smUser">user<small>administrator</small></div></div>
<div class="sm-apps">
<div class="sm-app" data-app="term"><div class="sm-app-icon">&#x1F5A5;</div><div class="sm-app-name">Terminal</div></div>
<div class="sm-app" data-app="fm"><div class="sm-app-icon">&#x1F4C1;</div><div class="sm-app-name">Файловый менеджер</div></div>
<div class="sm-app" data-app="editor"><div class="sm-app-icon">&#x1F4DD;</div><div class="sm-app-name">Текстовый редактор</div></div>
<div class="sm-app" data-app="calc"><div class="sm-app-icon">&#x1F9EE;</div><div class="sm-app-name">Калькулятор</div></div>
<div class="sm-app" data-app="net"><div class="sm-app-icon">&#x1F310;</div><div class="sm-app-name">Монитор сети</div></div>
<div class="sm-app" data-app="passgen"><div class="sm-app-icon">&#x1F510;</div><div class="sm-app-name">Генератор паролей</div></div>
<div class="sm-app" data-app="sys"><div class="sm-app-icon">&#x1F4CA;</div><div class="sm-app-name">Монитор системы</div></div>
<div class="sm-app" data-app="about"><div class="sm-app-icon">&#x2139;</div><div class="sm-app-name">О системе</div></div>
</div>
<div class="sm-footer">
<button class="sm-footer-btn" data-act="shutdown">&#x23FB; Выключить</button>
<button class="sm-footer-btn" data-act="reboot">&#x1F504; Перезагрузка</button>
</div>
</div>
<div id="ctxmenu"></div>
<div id="notifs"></div>
<div id="shutdown"><div class="shut-text">Завершение работы...</div></div>
<div class="taskbar">
<button class="tb-start" data-act="start">&#x26A1; 4ayka</button>
<div class="tb-sep"></div>
<div class="tb-apps" id="tbApps"></div>
<div class="tb-tray">
<span class="tb-tray-item" data-tray="theme" title="Тема">◐</span>
<span class="tb-tray-item" data-tray="wifi" title="Wi-Fi">&#x1F4F6;</span>
<span class="tb-tray-item" data-tray="vol" title="Audio">&#x1F50A;</span>
<span class="tb-tray-item" data-tray="bat" title="Battery">&#x1F50B;</span>
</div>
<div class="tb-clock" id="tbClock" data-act="start"></div>
</div>
<script>
var OS_VER='2.1';
var OS_BUILD='2026.09';
var USER='kremp';
var termUser=USER+'@4ayka';

function overlayFS(){
  var raw;
  try{raw=localStorage.getItem('4ayka_vfs');}
  catch(err){console.warn('fs load failed:',err);return;}
  if(!raw)return;
  var saved;
  try{saved=JSON.parse(raw);}
  catch(err){console.warn('fs load parse failed:',err);return;}
  Object.keys(saved).forEach(function(k){termFS[k]=saved[k];});
}

function fsNode(fp){return termFS[fp]||VFS[fp];}

function normPath(p){
  p=(p||'').trim().replace(/^['"]|['"]$/g,'');
  if(!p||p==='~')return '~';
  var abs=p.charAt(0)==='/';
  p=p.replace(/^~\/?/,'');
  if(!abs&&p.charAt(0)==='/')p=p.replace(/^\//,'');
  var parts=abs?[]:termDir.split('/');
  p.split('/').forEach(function(seg){
    if(!seg||seg==='.')return;
    if(seg==='..'){if(parts.length>1)parts.pop();else if(parts.length===1&&parts[0]!=='~')parts.pop();}
    else parts.push(seg);
  });
  var r=parts.join('/');
  if(!r)r='~';
  else if(r.indexOf('~')!==0)r='~/'.concat(r);
  return r;
}

function splitPath(fp){
  var i=fp.lastIndexOf('/');
  if(i<0)return {parent:'~',name:fp};
  return {parent:fp.slice(0,i),name:fp.slice(i+1)};
}

var _audio=null;
function sfx(kind){
  try{
    if(!_audio)_audio=new (window.AudioContext||window.webkitAudioContext)();
    if(_audio.state==='suspended')_audio.resume();
    var o=_audio.createOscillator();
    var g=_audio.createGain();
    o.type='sine';
    o.frequency.value=kind==='open'?880:kind==='close'?440:1320;
    var t=_audio.currentTime;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.02,t+0.005);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.12);
    o.connect(g);
    g.connect(_audio.destination);
    o.start(t);
    o.stop(t+0.14);
  }catch(err){console.warn('sfx disabled:',err);}
}

var _dragState=null;
document.addEventListener('mousemove',function(e){
  if(!_dragState)return;
  if(_dragState.kind==='drag'){
    var nx=_dragState.ox+e.clientX-_dragState.sx;
    var ny=_dragState.oy+e.clientY-_dragState.sy;
    nx=Math.max(-60,Math.min(nx,window.innerWidth-160));
    ny=Math.max(0,Math.min(ny,window.innerHeight-84));
    _dragState.w.style.left=nx+'px';
    _dragState.w.style.top=ny+'px';
  }else{
    _dragState.w.style.width=Math.max(320,_dragState.ox+e.clientX-_dragState.sx)+'px';
    _dragState.w.style.height=Math.max(220,_dragState.oy+e.clientY-_dragState.sy)+'px';
  }
});
document.addEventListener('mouseup',function(){_dragState=null;});

function initDrag(w,handle){
  handle.onmousedown=function(e){
    if(e.target.closest('.win-dot'))return;
    _dragState={kind:'drag',w:w,sx:e.clientX,sy:e.clientY,ox:w.offsetLeft,oy:w.offsetTop};
    focusWin(w.id.replace('win-',''));
    e.preventDefault();
  };
}

function initResize(w){
  var r=w.querySelector('.win-resize');
  r.onmousedown=function(e){
    _dragState={kind:'resize',w:w,sx:e.clientX,sy:e.clientY,ox:w.offsetWidth,oy:w.offsetHeight};
    e.preventDefault();
    e.stopPropagation();
  };
}

function setupWinEvents(w,id){
  w.onmousedown=function(){focusWin(id);};
  var head=w.querySelector('.win-head');
  if(head)head.addEventListener('dblclick',function(e){
    if(!e.target.closest('.win-dot'))maxWin(id);
  });
}

function focusWin(id){
  if(!wins[id])return;
  Object.keys(wins).forEach(function(k){wins[k].el.classList.remove('focused')});
  wins[id].el.classList.add('focused');
  wins[id].el.style.zIndex=++winZ;
  activeWin=id;
  updateTaskbar();
}

function closeWin(id){
  if(!wins[id])return;
  if(wins[id].el._netIv)clearInterval(wins[id].el._netIv);
  if(wins[id].el._sysIv)clearInterval(wins[id].el._sysIv);
  if(wins[id].el._netRO)wins[id].el._netRO.disconnect();
  wins[id].el.remove();
  delete wins[id];
  if(activeWin===id)activeWin=null;
  updateTaskbar();
  sfx('close');
}

function minWin(id){
  if(!wins[id])return;
  wins[id].el.style.display='none';
  if(activeWin===id)activeWin=null;
  updateTaskbar();
}

function maxWin(id){
  if(!wins[id])return;
  var w=wins[id];
  w.max=!w.max;
  w.el.classList.toggle('max',w.max);
}

function updateTaskbar(){
  var c=document.getElementById('tbApps');
  c.innerHTML='';
  Object.keys(wins).forEach(function(id){
    var d=document.createElement('div');
    d.className='tb-app'+(activeWin===id?' active':'');
    d.textContent=appName(id);
    d.onclick=function(){
      if(wins[id].el.style.display==='none'){wins[id].el.style.display='flex';focusWin(id);}
      else if(activeWin===id){minWin(id);}
      else{focusWin(id);}
    };
    c.appendChild(d);
  });
}

function initTerm(w){
  var out=w.querySelector('[id^=tout-]');
  var inp=w.querySelector('[id^=tin-]');
  var hist=[];
  var histIdx=-1;
  var cmds=['help','clear','ls','cd','cat','pwd','echo','whoami','uname','date','uptime','tree','ps','df','free','top','ping','cowsay','fortune','nano','mkdir','rm','touch','history','exit','reboot'];
  printTerm(out,'4aykaOS Terminal v1.0\nType "help" for commands.\n','#777');
  inp.onkeydown=function(e){
    if(e.key==='Enter'){
      var cmd=inp.value.trim();
      inp.value='';
      if(cmd){hist.push(cmd);histIdx=hist.length;printTerm(out,'\n'+termUser+' '+termDir+'$ '+cmd+'\n','#0af');execCmd(cmd,out);}
    }
    else if(e.key==='ArrowUp'){e.preventDefault();if(histIdx>0){histIdx--;inp.value=hist[histIdx];}}
    else if(e.key==='ArrowDown'){e.preventDefault();if(histIdx<hist.length-1){histIdx++;inp.value=hist[histIdx];}else{histIdx=hist.length;inp.value='';}}
    else if(e.key==='Tab'){
      e.preventDefault();
      var wd=inp.value.trim().split(/\s+/);
      var last=wd[wd.length-1].toLowerCase();
      if(!last)return;
      var suggestions;
      if(wd.length<=1){
        suggestions=cmds.filter(function(x){return x.indexOf(last)===0;});
      }else{
        var dir=fsNode(termDir);
        if(dir&&dir.children){
          suggestions=dir.children.filter(function(n){return n.toLowerCase().indexOf(last)===0;})
            .map(function(n){var ch=fsNode(termDir+'/'+n);return ch&&ch.type==='dir'?n+'/':n;});
        }else{suggestions=[];}
      }
      if(suggestions.length===1){
        wd[wd.length-1]=suggestions[0];
        inp.value=wd.join(' ')+(suggestions[0].charAt(suggestions[0].length-1)==='/'?'':' ');

        printTerm(out,suggestions.map(function(x){return x;}).join('  '),'#5a5');
      }
    }
  };
  inp.focus();
  w.onclick=function(){inp.focus();};
}

function execCmd(cmd,out){

        item.children.slice().sort().forEach(function(n){
          var child=fsNode(fp+'/'+n);

    },
    cd:function(){
      if(!a||a==='~'){termDir='~';return;}

      var item=fsNode(fp);
      if(item&&item.type==='dir'){termDir=fp;}
      else{printTerm(out,'cd: '+a+': No such directory','var(--r)');}
    },
    cat:function(){
      if(!a){printTerm(out,'cat: missing file','var(--r)');return;}
      a.split(/\s+/).forEach(function(f){
        var fp=normPath(f);
        var item=fsNode(fp);
        if(item&&item.type==='file'){printTerm(out,item.content||'[binary]');}
        else{printTerm(out,'cat: '+f+': No such file','var(--r)');}
      });
    },
    mkdir:function(){
      if(!a){printTerm(out,'mkdir: missing operand','var(--r)');return;}
      a.split(/\s+/).forEach(function(d){
        var fp=normPath(d);
        if(fsNode(fp)){printTerm(out,'mkdir: '+d+': File exists','var(--r)');return;}
        var e=splitPath(fp);
        var pp=fsNode(e.parent);
        if(!pp||pp.type!=='dir'){printTerm(out,'mkdir: '+d+': No such file or directory','var(--r)');return;}
        if(pp.children.indexOf(e.name)<0)pp.children.push(e.name);
        termFS[fp]={type:'dir',children:[]};
      });
      saveFSAndRefresh();
    },
    touch:function(){
      if(!a){printTerm(out,'touch: missing file operand','var(--r)');return;}
      a.split(/\s+/).forEach(function(f){
        var fp=normPath(f);
        var item=fsNode(fp);
        if(item&&item.type==='dir'){printTerm(out,'touch: '+f+': Is a directory','var(--r)');return;}
        var e=splitPath(fp);
        var pp=fsNode(e.parent);
        if(!pp||pp.type!=='dir'){printTerm(out,'touch: '+f+': No such file or directory','var(--r)');return;}
        if(pp.children.indexOf(e.name)<0)pp.children.push(e.name);
        termFS[fp]=termFS[fp]||{type:'file',size:'0B',content:''};
      });

    },
    rm:function(){
      if(!a){printTerm(out,'rm: missing operand','var(--r)');return;}
      var recursive=a==='-r'||a==='--recursive';
      if(recursive)a=parts.slice(2).join(' ');
      if(!a){printTerm(out,'rm: missing operand','var(--r)');return;}
      a.split(/\s+/).forEach(function(f){
        var fp=normPath(f);
        var item=fsNode(fp);
        if(!item){printTerm(out,'rm: '+f+': No such file or directory','var(--r)');return;}
        if(!recursive&&item.type==='dir'&&item.children.length){printTerm(out,'rm: '+f+': Is a directory (use rm -r)','var(--r)');return;}
        if(item.type==='dir'){
          Object.keys(termFS).forEach(function(k){if(k.indexOf(fp+'/')===0)delete termFS[k];});
          Object.keys(VFS).forEach(function(k){if(k.indexOf(fp+'/')===0)delete VFS[k];});
        }
        var e=splitPath(fp);
        var pp=fsNode(e.parent);
        if(pp&&pp.children){var i=pp.children.indexOf(e.name);if(i>=0)pp.children.splice(i,1);}
        delete termFS[fp];
        delete VFS[fp];
      });

    },
    tree:function(){

    ps:function(){

    },
    ping:function(){

    cowsay:function(){

function saveFSAndRefresh(){
  persistFS();
  Object.keys(wins).forEach(function(k){if(wins[k]&&wins[k].el._fmRender)wins[k].el._fmRender();});
}

function humanSize(n){
  var u=['B','KB','MB'];
  var i=0;
  while(n>=1024&&i<u.length-1){n/=1024;i++;}
  return (i?n.toFixed(1):String(n))+u[i];
}

function writeFile(fp,content){
  var item=fsNode(fp);
  if(!item){
    var e=splitPath(fp);
    var pp=fsNode(e.parent);
    if(!pp||pp.type!=='dir')return false;
    if(pp.children.indexOf(e.name)<0)pp.children.push(e.name);
    termFS[fp]={type:'file',size:humanSize(content.length),content:content};
  }else{
    if(!termFS[fp])termFS[fp]=JSON.parse(JSON.stringify(item));
    termFS[fp].content=content;
    termFS[fp].size=humanSize(content.length);
    termFS[fp].type='file';
  }
  persistFS();
  return true;
}

    list.textContent='';

    item.children.slice().sort().forEach(function(n){
      var fp=curDir+'/'+n;

function initCalc(w){
  var grid=w.querySelector('[id^=cgrid-]');
  var exprEl=w.querySelector('[id^=cexpr-]');
  var resEl=w.querySelector('[id^=cres-]');
  var expr='';
  var lastWasOp=false;
  var btns=['C','B','%','/','7','8','9','*','4','5','6','-','1','2','3','+','M','0','.','='];
  grid.style.gridTemplateColumns='repeat(4,1fr)';

  function safeEval(s){
    var idx=0;
    function parseExpr(){
      var v=parseTerm();
      while(idx<s.length&&(s[idx]==='+'||s[idx]==='-')){var op=s[idx++];var r=parseTerm();v=op==='+'?v+r:v-r;}
      return v;
    }
    function parseTerm(){
      var v=parseFactor();
      while(idx<s.length&&(s[idx]==='*'||s[idx]==='/'||s[idx]==='%')){
        var op=s[idx++];var r=parseFactor();
        if(op==='*')v=v*r;
        else if(op==='/'){if(r===0)throw new Error('div0');v=v/r;}
        else v=v%r;
      }
      return v;
    }
    function parseFactor(){
      if(idx<s.length&&s[idx]==='-'){idx++;return -parseFactor();}
      var start=idx;
      while(idx<s.length&&(/[0-9.]/.test(s[idx])))idx++;
      var tok=s.slice(start,idx);
      if(!tok)throw new Error('bad');
      return parseFloat(tok);
    }
    var val=parseExpr();
    if(idx!==s.length||!isFinite(val))throw new Error('bad');
    return val;
  }

  btns.forEach(function(b){
    var d=document.createElement('button');
    d.className='calc-btn';
    d.textContent=b;
    if('/*-+%'.indexOf(b)>=0&&b!=='M')d.classList.add('op');
    if(b==='=')d.classList.add('eq');
    if(b==='C'||b==='B')d.classList.add('clear');
    d.onclick=function(){
      if(b==='C'){expr='';lastWasOp=false;}
      else if(b==='B'){expr=expr.slice(0,-1);lastWasOp=false;}
      else if(b==='='){
        try{var r=safeEval(expr);resEl.textContent=isNaN(r)||!isFinite(r)?'Error':parseFloat(r.toFixed(10));expr=''+resEl.textContent;lastWasOp=true;}
        catch(err){resEl.textContent='Error';}
      }
      else if(b==='M'){expr=expr.startsWith('-')?expr.slice(1):'-'+expr;}
      else{if('/*-+'.indexOf(b)>=0&&lastWasOp){expr=expr.slice(0,-1);}lastWasOp='/*-+'.indexOf(b)>=0;expr+=b;}
      exprEl.textContent=expr;
    };
    grid.appendChild(d);
  });
}

function initNet(w){
  var canvas=w.querySelector('[id^=ncanvas-]');
  if(!canvas)return;
  var ctx=canvas.getContext('2d');
  var downEl=w.querySelector('[id^=ndown-]');
  var upEl=w.querySelector('[id^=nup-]');
  var rxEl=w.querySelector('[id^=nrx-]');
  var txEl=w.querySelector('[id^=ntx-]');
  var downData=[],upData=[],rxTotal=0,txTotal=0;
  function resize(){canvas.width=canvas.parentElement.offsetWidth;canvas.height=canvas.parentElement.offsetHeight;}
  resize();
  var ro=null;
  if(window.ResizeObserver){
    ro=new ResizeObserver(resize);
    ro.observe(canvas.parentElement);
  }else{
    window.addEventListener('resize',resize);
  }
  w._netRO=ro;
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    var mx=Math.max.apply(null,downData.concat(upData).concat([100]));
    var step=canvas.width/60;
    ctx.strokeStyle='rgba(0,60,0,0.3)';ctx.lineWidth=0.5;
    for(var y=0;y<canvas.height;y+=20){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke();}
    if(downData.length>1){
      ctx.beginPath();ctx.strokeStyle='#00ff41';ctx.lineWidth=1.5;
      downData.forEach(function(v,i){
        var x=i*step;var yy=canvas.height-v/mx*canvas.height*0.9;
        if(i===0)ctx.moveTo(x,yy);else ctx.lineTo(x,yy);
      });ctx.stroke();
    }
    if(upData.length>1){
      ctx.beginPath();ctx.strokeStyle='#00ffff';ctx.lineWidth=1.5;
      upData.forEach(function(v,i){
        var x=i*step;var yy=canvas.height-v/mx*canvas.height*0.9;
        if(i===0)ctx.moveTo(x,yy);else ctx.lineTo(x,yy);
      });ctx.stroke();
    }
  }
  function update(){
    var d=50+Math.random()*300;
    var u=20+Math.random()*150;
    downData.push(d);upData.push(u);
    if(downData.length>60)downData.shift();
    if(upData.length>60)upData.shift();
    rxTotal+=Math.floor(d*10);txTotal+=Math.floor(u*10);
    downEl.textContent=d.toFixed(0)+' KB/s';
    upEl.textContent=u.toFixed(0)+' KB/s';
    rxEl.textContent=rxTotal.toLocaleString();
    txEl.textContent=txTotal.toLocaleString();
    draw();
  }
  w._netIv=setInterval(update,1000);
  update();
}

function initSys(w){
  var c=w.querySelector('[id^=sysContent-]');
  if(!c)return;
  var cpuData=15,memData=25,diskData=30;
  function render(){
    cpuData=Math.max(5,Math.min(95,cpuData+Math.random()*20-10));
    memData=Math.max(15,Math.min(85,memData+Math.random()*8-4));
    diskData=Math.min(99,diskData+Math.random()*0.3);
    var uptime=Math.floor((Date.now()-startTime)/1000);
    var h=Math.floor(uptime/3600);
    var m=Math.floor((uptime%3600)/60);
    var s=uptime%60;
    var cpuClass=cpuData>80?'red':cpuData>50?'yellow':'green';
    function row(label,val){var r=document.createElement('div');r.className='sys-row';var a=document.createElement('span');a.textContent=label;var b=document.createElement('span');b.className='val';b.textContent=val;r.appendChild(a);r.appendChild(b);return r;}
    c.textContent='';
    var sec1=document.createElement('div');sec1.className='sys-section';
    sec1.appendChild(row('CPU Usage',cpuData.toFixed(1)+'%'));
    var bar1=document.createElement('div');bar1.className='sys-bar';
    var fill1=document.createElement('div');fill1.className='sys-fill '+cpuClass;fill1.style.width=cpuData+'%';
    bar1.appendChild(fill1);sec1.appendChild(bar1);
    sec1.appendChild(row('Cores','8 / 8 active'));
    sec1.appendChild(row('Temp',(45+cpuData*0.4).toFixed(0)+' C'));
    c.appendChild(sec1);
    var sec2=document.createElement('div');sec2.className='sys-section';
    sec2.appendChild(row('Memory',(memData*163.84).toFixed(0)+' MB / 16384 MB'));
    var bar2=document.createElement('div');bar2.className='sys-bar';
    var fill2=document.createElement('div');fill2.className='sys-fill cyan';fill2.style.width=memData+'%';
    bar2.appendChild(fill2);sec2.appendChild(bar2);
    c.appendChild(sec2);
    var sec3=document.createElement('div');sec3.className='sys-section';
    sec3.appendChild(row('Disk',(diskData*2.62).toFixed(0)+' GB / 262 GB'));
    var bar3=document.createElement('div');bar3.className='sys-bar';
    var fill3=document.createElement('div');fill3.className='sys-fill green';fill3.style.width=diskData+'%';
    bar3.appendChild(fill3);sec3.appendChild(bar3);
    c.appendChild(sec3);
    var sec4=document.createElement('div');sec4.className='sys-section';
    sec4.appendChild(row('Uptime',h+'h '+m+'m '+s+'s'));
    sec4.appendChild(row('Processes',String(Math.floor(120+Math.random()*30))));
    c.appendChild(sec4);
  }
  render();
  w._sysIv=setInterval(render,2000);
}

document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){closeMenus();if(activeWin)closeWin(activeWin);}
});
document.addEventListener('keydown',function(e){

    var li=document.getElementById('login');
    if(li&&li.classList.contains('show')&&!li.classList.contains('hide')){login();}
  }
});

if(loginName)loginName.textContent=termUser;
var smUser=document.getElementById('smUser');
if(smUser){smUser.childNodes[0].nodeValue=USER;}

// Event delegation: all clickable OS chrome uses data-act/data-app/data-tray.
document.addEventListener('click',function(e){
  var el=e.target;
  while(el&&!el.dataset.act&&!el.dataset.app&&!el.dataset.tray){el=el.parentElement;}
  if(!el)return;
  if(el.dataset.app){
    if(el.classList.contains('dicon'))return;
    openApp(el.dataset.app);
    toggleStart();
    return;
  }
  if(el.dataset.tray){
    switch(el.dataset.tray){
      case 'theme':{
        var l=document.body.classList.toggle('light');
        try{localStorage.setItem('4ayka_theme',l?'light':'dark');}
        catch(err){console.warn('theme persist failed:',err);}
        showNotif('Вид','Тема: '+(l?'светлая':'тёмная'));
        break;
      }
      case 'wifi':showNotif('Сеть','Wi-Fi: 4ayka_Studio_5G - 120 Мбит/с');break;
      case 'vol':showNotif('Аудио','Звук: Procedural, 100%');break;
      case 'bat':showNotif('Батарея','98%, заряжается');break;
    }
    return;
  }
  switch(el.dataset.act){
    case 'start': toggleStart(); break;
    case 'shutdown': closeMenus(); doShutdown(); break;
    case 'reboot': closeMenus(); doReboot(); break;
    case 'close': closeWin(el.dataset.wid); break;
    case 'min': minWin(el.dataset.wid); break;
    case 'max': maxWin(el.dataset.wid); break;
    case 'fm-up': fmUp(el); break;
    case 'fm-root': fmRoot(el); break;
    case 'fm-refresh': fmRefresh(el); break;
    case 'ed-new': editorNew(el); break;
    case 'ed-save': editorSave(el); break;
    case 'ed-open': editorOpen(el); break;
    case 'ed-load': {var w=el.closest('.win');if(w)loadEditorPath(w);} break;
    case 'pg-gen': genPass(el); break;
    case 'pg-copy': copyPass(el); break;
  }
});
document.addEventListener('dblclick',function(e){
  var el=e.target;
  while(el&&!el.classList.contains('dicon')){el=el.parentElement;}
  if(el&&el.dataset.app)openApp(el.dataset.app);
});

bootSeq();
</script>
