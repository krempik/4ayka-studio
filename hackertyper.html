<style>

        .prompt { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); z-index: 10; color: var(--green-dark); font-size: 0.8rem; text-align: center; animation: fade 2s ease-in-out infinite; }

        .header { position: fixed; top: 0; left: 0; width: 100%; z-index: 10; display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; background: rgba(10,10,10,0.9); border-bottom: 1px solid #1a1a1a; }
        .logo { font-size: 1rem; letter-spacing: 3px; text-shadow: 0 0 10px var(--green-dark); }

        #counter { color: var(--green); font-size: 1.2rem; }

        @keyframes pulse2 { 0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; } }

        function addChars(count) {
            let added = '';
            for (let i = 0; i < count && charIndex < hackCode.length; i++) {
                added += hackCode[charIndex];
                charIndex++;
            }
            if (added) {
                codeEl.innerHTML += added;
                codeEl.scrollTop = codeEl.scrollHeight;
            }
            if (charIndex >= hackCode.length && count > 50) {
                showAccess();
            }
        }

        function showAccess() {
            accessEl.style.display = 'block';
            setTimeout(() => { accessEl.style.display = 'none'; }, 3000);
            charIndex = 0;
            codeEl.innerHTML = '';
        }

        document.addEventListener('keydown', function(e) {
            if (e.key.length === 1 || e.key === 'Tab') {
                e.preventDefault();
                addChars(3);
                count++;
                counterEl.textContent = count;
                document.querySelector('.prompt').style.display = 'none';
            }
            if (e.key === 'Escape') {
                showAccess();
            }
        });

        // MATRIX RAIN
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        resize();
        window.addEventListener('resize', resize);
        const chars = '01アイウエオカキクケコサシスセソタチツテト';
        const fs = 14;
        let cols = Math.floor(canvas.width / fs);
        let drops = Array(cols).fill(1);
        function drawMatrix() {
            ctx.fillStyle = 'rgba(10,10,10,0.04)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00ff41';
            ctx.font = fs + 'px monospace';
            for (let i = 0; i < drops.length; i++) {
                ctx.fillText(chars[Math.floor(Math.random() * chars.length)], i * fs, drops[i] * fs);
                if (drops[i] * fs > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 50);
        window.addEventListener('resize', () => { cols = Math.floor(canvas.width / fs); drops = Array(cols).fill(1); });
    </script>
